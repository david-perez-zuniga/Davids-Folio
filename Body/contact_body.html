<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davids-folio | Contacto</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/src/style.css"> <link rel="stylesheet" href="/Style/contact_style.css">
</head>
<body>

    <nav class="back-nav">
        <a href="/" class="btn-back">
            <span class="arrow">←</span> INICIO
        </a>
    </nav>

    <main class="contact-container">
        <h2 class="section-title">¿Quieres saber más? <span class="neon-text">Contactame</span></h2>

        <div class="contact-grid">
            
            <div class="contact-info">
                <h3>¿Listo para empezar un proyecto?</h3>
                <p>
                    Ya sea que tengas una idea de "Gym Tech", necesites un backend robusto o simplemente quieras saludar. 
                    Estoy siempre abierto a nuevos retos.
                </p>

                <div class="info-item">
                    <span class="icon">📱</span> 
                    <a href="https://wa.me/50576357999?text=Hola%20David,%20vengo%20de%20tu%20portafolio!" target="_blank" class="info-link">
                    Enviar WhatsApp
                    </a>
                </div>
                
                <div class="info-item">
                    <span class="icon">🐙</span>
                    <a href="https://github.com/destripador2000" target="_blank" class="info-link">github.com/david</a>
                </div>

                <div class="info-item">
                    <span class="icon">💼</span>
                    <a href="https://www.linkedin.com/in/humberto-zuniga-b42140386/" target="_blank" class="info-link">linkedin.com/in/david</a>
                </div>
            </div>

            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Mensaje</label>
                    <textarea id="message" rows="5" placeholder="Cuéntame tu idea..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">ENVIAR MENSAJE</button>
            </form>

        </div>
    </main>

    <script type="module" src="/Action/contact_action.ts"></script>
</body>
</html>
